function sheetRowHtml(b, rn, anim, delay, mode, dups){
  const ec = k => 'ed' + (b._edited && EDITS.ov[b._k] && EDITS.ov[b._k][k] !== undefined ? ' edited' : '');
  const dot = (b._new && !b._blank) ? '<i class="dot-new" title="row added in this app"></i>' : '';
  const nameCell = b._blank ? '<span class="bhint">type here</span>' : (dot + esc(b.name||'—'));
  const animCls = anim ? (mode === 'flip' ? ' anim-flip' : ' anim-in') : '';
  const dup = k => (dups && dups[k]) ? ' dup' : '';
  const animStyle = (anim && delay) ? ` style="animation-delay:${delay}ms"` : '';
  return `<tr class="br ${STATUS_CLASS[b.status]||'s-NoStatus'} ${b.repeat?'repeat':''} ${b._new?'isnew':''} ${b._edited?'isedited':''} ${b._blank?'isblank':''}${animCls}" data-bk="${esc(b._k)}"${animStyle}>
    <td class="rn">${rn}</td>
    <td class="${ec('status')} st" data-k="status">${esc(b._blank ? 'No Status' : b.status)}</td>
    <td class="${ec('source')}${dup('source')}" data-k="source" title="${esc(b.source)}">${esc(b.source)}</td>
    <td class="${ec('offer')} num" data-k="offer" title="${esc(b.offerTxt||'')}">${b.offer?money(b.offer):esc(b.offerTxt||'')}</td>
    <td class="${ec('earnest')}" data-k="earnest">${esc(b.earnest||'')}</td>
    <td class="${ec('type')}${dup('type')}" data-k="type">${esc(b.type||'')}</td>
    <td class="${ec('name')} nm" data-k="name" data-rows="${b.rows}">${nameCell}</td>
    <td class="${ec('phone')} tel" data-k="phone">${esc(b.phone||'')}</td>
    <td class="${ec('email')} em" data-k="email" title="${esc(b.email)}">${esc(b.email||'')}</td>
    <td class="${ec('last')} num" data-k="last">${esc(b.last||'')}</td>
    <td class="${ec('notes')} nt" data-k="notes" title="${esc(b.notes)}">${esc(cleanNote(b.notes).slice(0,150))}${cleanNote(b.notes).length>150?'…':''}</td>
    <td class="cid">${esc(b.id)}</td>
    <td class="act"><div class="grp">
      ${b.raw?`<a class="btn wa" href="${waLink(b.raw)}" target="_blank" rel="noopener" title="WhatsApp">${IC.wa}</a>`:''}
      ${b.raw?`<button class="btn" data-copy="${esc(b.phone)}" title="Copy phone">${IC.copy}</button>`:''}
      ${b.email?`<a class="btn" href="mailto:${esc(b.email)}" title="Email">${IC.mail}</a>`:''}
      <button class="btn del" data-del="${esc(b._k)}" title="Delete this row">${IC.trash}</button>
    </div></td>
  </tr>`;
}

function renderSheet(){
  const body = $('#sBody'); if(!body) return;
  const html = [];
  let shown = 0, rn = 0;
  D.props.forEach(p => {
    const rows = sheetRows(p);
    if(!rows.length && !p._new) return;   // brand-new properties still show their banner
    shown += rows.length;
    // a search or a status filter opens the groups that still have matches,
    // so a hit is never hidden behind a collapsed property
    const open = SHEET.open.has(String(p.row)) ||
                 ((!!SHEET.q || SHEET.status.size > 0) && rows.length > 0);
    const cls = p.status === 'Sold' ? 'sold' : p.status === 'Pending' ? 'pending'
      : p.status === 'Available' ? '' : 'off';
    const isNewLead = p._new && SHEET.animKey === String(p.row);
    html.push(`<tr class="sb ${cls} ${open?'open':''}${isNewLead ? ' anim-new' : ''}" data-g="${p.row}">
      <td colspan="${SHEET_COLS.length}"><div class="bwrap">
        <span class="caret">${IC.caret}</span>
        <span class="addr">${esc(p.address)}</span>
        <span class="pill">${esc(p.status)}</span>
        ${p.price?`<span class="pill">${money(p.price)}</span>`:''}
        <span class="pill warn">${rows.length} ${rows.length===1?'reply':'replies'}</span>
        ${p.interested?`<span class="pill">${p.interested} interested</span>`:''}
        ${p._new?`<span class="pill">new</span>`:''}
        <button class="addb" data-addprop="${esc(String(p.row))}">${IC.plus} Add buyer</button>
        <span class="num">${open?'−':'+'}</span>
      </div></td></tr>`);
    if(!open) return;
    const blanks = blankRowsOf(p);
    const showBlanks = !SHEET.q && !SHEET.status.size;   // placeholders only in the unfiltered sheet
    if(!rows.length && !blanks.length){
      html.push(`<tr class="more"><td colspan="${SHEET_COLS.length}">
        <button class="btn sm" data-addprop="${esc(String(p.row))}">${IC.plus} Add the first buyer row</button>
      </td></tr>`);
      return;
    }
    const anim = SHEET.animKey === String(p.row);
    let ai = 0;
    const rowAnim = () => (anim && ai < 22) ? [(ai++) * 16] : [0];
    const slice = rows.slice(0, SHEET.limit);
    let prevSrc = '', prevTyp = '';
    const dupOf = b => ({
      source: !!b.source && b.source === prevSrc,
      type: !!b.type && b.type === prevTyp,
    });
    slice.forEach(b => {
      rn++;
      const [d] = rowAnim();
      const dups = !SHEET.compact ? dupOf(b) : null;
      html.push(sheetRowHtml(b, rn, anim, d, isNewLead ? 'flip' : 'in', dups));
      prevSrc = b.source || prevSrc; prevTyp = b.type || prevTyp;
    });
    if(rows.length > SHEET.limit){
      html.push(`<tr class="more"><td colspan="${SHEET_COLS.length}">
        + ${rows.length - SHEET.limit} more replies — open this property in Properties to see everyone
      </td></tr>`);
    }
    if(showBlanks){
      blanks.forEach(b => { rn++; const [d] = rowAnim(); html.push(sheetRowHtml(b, rn, anim, d, isNewLead ? 'flip' : 'in', null)); });
      html.push(`<tr class="addrow"><td colspan="${SHEET_COLS.length}">
        <button class="btn sm" data-newrow="${esc(String(p.row))}" data-n="1">${IC.plus} Add a blank row</button>
        <button class="btn sm" data-newrow="${esc(String(p.row))}" data-n="5">${IC.plus} 5 rows</button>
      </td></tr>`);
    }
  });
  body.innerHTML = html.join('') || `<tr><td colspan="${SHEET_COLS.length}">
    <div class="empty"><b>No replies match</b>Clear the search or the status filter.</div></td></tr>`;
  const cnt = $('#sCount');
  if(cnt) cnt.textContent = `${num(shown)} replies · ${num(D.props.filter(p=>sheetRows(p).length).length)} properties`;
  $$('tr.sb', body).forEach(tr => tr.querySelector('.bwrap').onclick = () => {
    const row = tr.dataset.g;
    if(SHEET.open.has(row)){ SHEET.open.delete(row); SHEET.animKey = null; }
    else { SHEET.open.add(row); SHEET.animKey = row; }
    renderSheet();
  });
  $$('#sBody .addb').forEach(b => b.onclick = e => { e.stopPropagation(); openBuyerForm(b.dataset.addprop); });
  $$('#sBody td.ed').forEach(td => {
    td.onclick = () => { setActiveCell(td); startEdit(td); };
    td.addEventListener('focus', () => setActiveCell(td));
  });
  updateStickyGroup();
  $$('#sBody [data-del]').forEach(b => b.onclick = e => { e.stopPropagation(); deleteRow(b.dataset.del); });
  $$('#sBody [data-newrow]').forEach(b => b.onclick = e => {
    e.stopPropagation(); addBlankRows(b.dataset.newrow, Number(b.dataset.n) || 1);
  });
  SHEET.animKey = null;                     // one-shot: the next render is static
  renderChips();
  applyActiveCell();
  bindCopy();
}

function msgBlock(f, opt={}){
  const isSent = SENT.has(f.raw);
  const gone = f.gone && f.gone.length
    ? `<div class="body" style="border:1px solid #f4c9c9;background:#fdf3f3;color:#8b2020;margin-top:6px">
         ${'⚠'} No longer available on the site: ${esc(f.gone.join(', '))}</div>` : '';
  const until = snoozedUntil(f.raw);
  const kind = f._kind || 'cold';
  const noteBox = (f.note && String(f.note).trim())
    ? `<div class="lastc ${kind==='no'?'neg':(kind==='warm'||kind==='closing')?'pos':''}">
         <b>Last conversation · Dispo Genius</b>${esc(String(f.note).replace(/\s+/g,' ').trim().slice(0,220))}</div>`
    : '';
  return `<div class="msg ${isSent?'sent':''}${until?' snoozed':''}">
    <div class="mh"><b>${esc(f.name)}</b><span class="tel">${esc(f.phone)}</span>
      ${buyerChip(f.status)} ${daysChip(f.days)}
      ${f.n>1?`<span class="chip p">${f.n} properties</span>`:''}
      ${isSent?`<span class="chip g">${'✓'} sent</span>`:''}
      ${until?`<span class="chip k">parked to ${esc(until)}</span>`:''}</div>
    <div class="body">${esc(f.msg)}</div>${gone}${noteBox}
    <div class="macts">
      <a class="btn sm wa" href="${waLink(f.raw)}" target="_blank" rel="noopener">${IC.wa} WhatsApp</a>
      <button class="btn sm" data-copy="${esc(f.msg)}">${IC.copy} Copy message</button>
      <button class="btn sm" data-vary="${esc(f.raw)}" title="Another wording">Another wording</button>
      <button class="btn sm" data-copy="${esc(f.phone)}">Copy number</button>
      ${!opt.today?`<button class="btn sm" data-openprop="${esc(f.props[0])}">${IC.home} Property</button>`:''}
      <button class="btn sm ${isSent?'':'ghost'}" data-sent="${esc(f.raw)}"
        title="Mark sent">${IC.check} ${isSent?'Undo':'Mark sent'}</button>
      <select class="snooze" data-snooze="${esc(f.raw)}" aria-label="Snooze this person">
        <option value="">Park…</option>
        <option value="3">3 days</option>
        <option value="7">1 week</option>
        <option value="30">1 month</option>
        ${until?'<option value="0">Back on the list</option>':''}
      </select>
    </div></div>`;
}

function renderContacts(){
  const body = $('#cBody'); if(!body) return;
  let list = D.contacts.filter(c => {
    if(cQ && !(c.name+' '+c.phone+' '+c.email+' '+c.city).toLowerCase().includes(cQ)) return false;
    if(cOnly === 'phone') return !!c.raw;
    if(cOnly === 'repeat') return c.props > 1;
    if(cOnly === 'email') return !c.raw && !!c.email;
    return true;
  });
  const cmp = {
    name: (a,b) => (a.name||'').localeCompare(b.name||''),
    interested: (a,b) => b.interested - a.interested,
    props: (a,b) => b.props - a.props,
    last: (a,b) => String(b.last).localeCompare(String(a.last)),
  }[cSort];
  list = list.slice().sort(cmp);
  body.innerHTML = list.slice(0, cLimit).map((c,i) => `<tr>
    <td class="who"><b>${esc(c.name||'No name')}</b><span>${esc(c.id)}${c.city?' · '+esc(c.city):''}</span></td>
    <td class="mono">${esc(c.phone||'—')}</td>
    <td style="font-size:11.5px;color:#5b6b7e">${esc(c.email||'')}</td>
    <td class="c">${c.interested?`<span class="chip b">${c.interested}</span>`:'—'}</td>
    <td class="c num">${c.props}</td>
    <td style="font-size:11.5px;color:#5b6b7e">${esc(c.sources)}</td>
    <td class="num">${esc(fmtDate(c.last))}</td>
    <td>${c.raw?`<a class="btn sm wa" href="${waLink(c.raw)}" target="_blank" rel="noopener"
        aria-label="WhatsApp">${IC.wa}</a>`:''}</td></tr>`).join('')
    || `<tr><td colspan="8"><div class="empty"><b>No matches</b>Adjust the filters above.</div></td></tr>`;
  const more = $('#cMore');
  more.style.display = list.length > cLimit ? '' : 'none';
  more.textContent = `Show more (${list.length - cLimit} left)`;
}

const searchInput = $('#q'), resultsBox = $('#results');
let selIdx = -1, lastResults = [];
function doSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ resultsBox.hidden = true; lastResults = []; return; }
  const props = D.props.filter(p => (p.address+' '+p.city+' '+p.zip).toLowerCase().includes(q)).slice(0,5);
  const people = D.contacts.filter(c => (c.name+' '+c.phone+' '+c.email).toLowerCase().includes(q)).slice(0,5);
  const msgs = D.followups.filter(f => (f.name+' '+f.raw+' '+f.props.join(' ')).toLowerCase().includes(q)).slice(0,4);
  lastResults = [
    ...props.map(p => ({type:'prop', label:p.address, sub:`${p.city} ${p.zip} · ${money(p.price)} · ${p.n} buyers`, data:p})),
    ...people.map(c => ({type:'person', label:c.name||c.phone, sub:`${c.phone||'no phone'} · ${c.props} properties`, data:c})),
    ...msgs.map(f => ({type:'msg', label:f.name, sub:`${f.phone} · ${f.days}d cold`, data:f})),
  ];
  selIdx = -1;
  if(!lastResults.length){
    resultsBox.innerHTML = `<div class="empty">No results for “${esc(q)}”</div>`;
    resultsBox.hidden = false; return;
  }
  let html = '', group = '';
  lastResults.forEach((r,i) => {
    const g = r.type === 'prop' ? 'Properties' : r.type === 'person' ? 'Buyers' : 'Follow-ups';
    if(g !== group){ html += `<div class="grp">${g}</div>`; group = g; }

/* ── reading elevatereg.com straight from the browser ──────────────────────
   The site answers every origin (its CORS header echoes whatever Origin it is
   given), so a hosted copy of this app can walk the listings itself — no
   middleman. From a file:// page the browser sends `Origin: null`, which the
   site does not accept, so the Apps Script bridge is used instead. */
const SITE_ORIGIN = 'https://www.elevatereg.com';

function parseSitePage(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  doc.querySelectorAll('article.property').forEach(a => {
    const txt = el => (el ? el.textContent.trim() : '');
    const title = txt(a.querySelector('.property-title'));
    if(!title) return;
    const lead = txt(a.querySelector('li.lead b'));
    const badge = txt(a.querySelector('.badge'));
    const nums = [...a.querySelectorAll('ul.property-details li')].map(txt);
    const num = rx => { const hit = nums.find(x => rx.test(x)); return hit ? hit.match(rx)[1] : ''; };
    const id = (a.className.match(/post-(\d+)/) || [])[1] || title;
    out.push({
      id: String(id), address: title, price: lead,
      beds: num(/([\d.]+)\s*bd/i), baths: num(/([\d.]+)\s*ba/i),
      sqft: num(/([\d,]+)\s*sqft/i).replace(/,/g, ''),
      badge: badge, terms: txt(a.querySelector('.property-type-heading')),
      link: (a.querySelector('a[href]') || {}).href || '',
      img: (a.querySelector('img') || {}).src || '',
    });
  });
  return out;
}

async function fetchSiteDirect(onStep){
  const rows = [], seen = new Set(), bad = [];
  let failures = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  /* the CDN throttles bursts, so pages are read one at a time, with retries */
  for(const status of ['available', 'unavailable']){
    let page = 1, maxPage = 1, misses = 0;
    while(page <= maxPage && page <= 60){
      const url = SITE_ORIGIN + '/property/' + (page > 1 ? `page/${page}/` : '') + '?status=' + status;
      let html = '';
      for(let attempt = 0; attempt < 3 && !html; attempt++){
        try{
          const res = await fetch(url, {mode: 'cors', credentials: 'omit'});
          if(res.ok) html = await res.text();
          else if(res.status === 404) break;
        }catch(e){ failures++; }
        if(!html) await wait(700 * (attempt + 1));
      }
      if(!html || html.indexOf('<article') < 0){
        bad.push({status, page});          // retried once the walk is over
        if(++misses >= 3) break;
        page++;
        await wait(400);
        continue;
      }
      misses = 0;
      (html.match(/\/property\/page\/(\d+)\//g) || []).forEach(x => {
        const n = Number(String(x).replace(/[^\d]/g, ''));
        if(n > maxPage) maxPage = n;
      });
      parseSitePage(html).forEach(c => {
        if(seen.has(c.id)) return;
        seen.add(c.id);
        c.status = status === 'unavailable' ? (c.badge || 'Sold') : (c.badge || 'Available');
        c.available = c.status === 'Available';
        rows.push(c);
      });
      if(onStep) onStep(rows.length, status, page, maxPage);
      page++;
      await wait(350);
    }
  }
  /* a page that came back empty is almost always a throttle blip, not a page
     with no homes — read it once more before settling for a shorter list */
  const grab = async (status, page) => {
    const url = SITE_ORIGIN + '/property/' + (page > 1 ? `page/${page}/` : '') + '?status=' + status;
    for(let attempt = 0; attempt < 4; attempt++){
      try{
        const res = await fetch(url, {mode: 'cors', credentials: 'omit'});
        if(res.ok){
          const html = await res.text();
          if(html.indexOf('<article') > -1){
            parseSitePage(html).forEach(c => {
              if(seen.has(c.id)) return;
              seen.add(c.id);
              c.status = status === 'unavailable' ? (c.badge || 'Sold') : (c.badge || 'Available');
              c.available = c.status === 'Available';
              rows.push(c);
            });
            return true;
          }
        }
      }catch(e){ failures++; }
      await wait(900 * (attempt + 1));
    }
    return false;
  };
  let mended = 0;
  for(const b of bad){
    await wait(500);
    if(await grab(b.status, b.page)) mended++;
  }
  if(rows.length < 50) throw new Error('The site is throttling this browser — try again in a minute');
  const by = s => rows.filter(r => r.status === s).length;
  return {listings: rows, count: rows.length, available: by('Available'),
          pending: by('Pending'), sold: by('Sold'), checked: nowIso().slice(0, 10),
          failures, mended, short: bad.length - mended};
}

/* the bridge (Apps Script) does the same walk server side, with a 6 h cache */
async function fetchSiteViaBridge(force){
  if(!SYNC.url) throw new Error('No bridge connected');
  const r = await jsonp(SYNC.url, {action: 'site', force: force ? 1 : ''}, 300000);
  if(!r || !r.ok) throw new Error((r && r.error) || 'The bridge did not answer');
  if(!r.listings || !r.listings.length) throw new Error('The bridge returned no listings');
  return {listings: r.listings, count: r.count, available: r.available,
          pending: r.pending, sold: r.sold, checked: (r.checked || nowIso()).slice(0, 10)};
}

/* try the browser first, then the bridge — whichever manages to read the site */
async function refreshSite(force, onStep){
  let snap = null, why = null;
  if(location.protocol !== 'file:'){          // a file:// page has no origin the site accepts
    try{ snap = await fetchSiteDirect(onStep); }
    catch(e){ why = e; }
  }
  if(!snap){
    try{ snap = await fetchSiteViaBridge(force); }
    catch(e){ why = why || e; }
  }
  if(!snap) throw why || new Error('The site could not be read');
  /* a read that lost a whole page is a throttle artefact, not news — keep the
     snapshot we already trust instead of hiding a dozen homes */
  const known = (SITE_STORE && SITE_STORE.snap && SITE_STORE.snap.count) ||
                (window.__SITE_SNAPSHOT__ && window.__SITE_SNAPSHOT__.count) || 0;
  if(known && snap.count < known - 12)
    throw new Error(`read only ${snap.count} of ~${known} listings — keeping the previous snapshot`);
  store.set(SITE_KEY, {snap, at: nowIso()});
  applyLive(snap);
  return snap;
}
function siteAge(){
  const at = SITE_STORE && SITE_STORE.at ? new Date(SITE_STORE.at).getTime() : 0;
  return at ? Date.now() - at : Infinity;
}
const refreshBtn = $('#refreshBtn');
if(refreshBtn) refreshBtn.onclick = async () => {
  const original = refreshBtn.textContent;
  refreshBtn.disabled = true; refreshBtn.textContent = 'Checking elevatereg.com…';
  try{
    const snap = await refreshSite(true);
    refreshBtn.disabled = false; refreshBtn.textContent = original;
    toast(`Site: ${snap.available} available · ${snap.pending} pending · ${snap.sold} sold · ${snap.count} listings`);
  }catch(err){
    refreshBtn.disabled = false; refreshBtn.textContent = original;
    if(location.protocol !== 'file:'){
      try{
        const res = await fetch('/api/refresh', {headers:{'accept':'application/json'}});
        const snap = await res.json();
        if(snap && !snap.error){ applyLive(snap); toast(`Live: ${snap.available} available · ${snap.count} listings`); return; }
      }catch(e){}
    }
    toast('Site refresh failed — showing the last snapshot (' + err.message + ')');
  }
};
/* a background refresh when the copy on this device is getting old */
const SITE_TRIED = 'dispo:siteTried';
async function refreshSiteIfStale(){
  if(siteAge() < SITE_MAX_AGE) return;
  // do not hammer the site on every load when it is throttling us
  const tried = Number(store.get(SITE_TRIED, 0)) || 0;
  if(Date.now() - tried < 20 * 60000) return;
  if(location.protocol === 'file:' && !SYNC.url) return;
  store.set(SITE_TRIED, Date.now());
  try{
    const snap = await refreshSite(false);
    toast(`Properties refreshed from elevatereg.com · ${snap.count} listings`);
  }catch(e){}
}

/* ── snooze: park a person for a while ── */
const SNOOZE_KEY = 'dispo:snooze';
let SNOOZE = store.get(SNOOZE_KEY, {}) || {};
const todayStr = () => new Date().toISOString().slice(0,10);
const saveSnooze = () => store.set(SNOOZE_KEY, SNOOZE);
const isSnoozed = raw => !!(SNOOZE[raw] && SNOOZE[raw] >= todayStr());
const snoozedUntil = raw => (SNOOZE[raw] && SNOOZE[raw] >= todayStr()) ? SNOOZE[raw] : '';
function setSnooze(raw, days){
  const before = SNOOZE[raw];
  if(!days){ delete SNOOZE[raw]; }
  else {
    const d = new Date(); d.setDate(d.getDate() + Number(days));
    SNOOZE[raw] = d.toISOString().slice(0,10);
  }
  saveSnooze();
  pushUndo(days ? 'snooze' : 'unsnooze', () => {
    if(before) SNOOZE[raw] = before; else delete SNOOZE[raw];
    saveSnooze(); route();
  });
  toast(days ? `Parked until ${SNOOZE[raw]}` : 'Back on the list');
  route();
}

}
function undoLast(){
  const u = UNDO.pop();
  if(!u) { toast('Nothing to undo'); return; }
  try{ u.fn(); }catch(e){ toast('Could not undo that'); }
  paintUndo(); toast('Undone: ' + u.label);
}

  const b = $('#undoBtn');

  b.disabled = !UNDO.length;
  b.textContent = UNDO.length ? `Undo (${UNDO.length})` : 'Undo';
  b.title = UNDO.length ? 'Undo ' + UNDO[UNDO.length-1].label : 'Nothing to undo';
}

function tableToCsv(table){
  const rows = [];
  table.querySelectorAll('tr').forEach(tr => {
    if(tr.classList.contains('sb')) return;                       // banner rows
    const cells = [...tr.querySelectorAll('th,td')].map(td => {

  if(tables.length){
    csv = tables.map((t, i) => {
      const card = t.closest('.card'), h = card && card.querySelector('.card-h h3');
      const title = h ? h.textContent.replace(/\s+/g,' ').trim() : 'Table ' + (i + 1);
      return (tables.length > 1 ? `# ${title}\n` : '') + tableToCsv(t);
    }).join('\n\n');
  } else {
    const msgs = $$('.msg', v);
    if(msgs.length){
      csv = 'Name,Phone,Status,Last touch,Message\n' + msgs.map(m => {
        const b = m.querySelector('.mh b'), tel = m.querySelector('.tel'), body = m.querySelector('.body');
        return [b && b.textContent, tel && tel.textContent, '', '', body && body.textContent]
          .map(csvCell).join(',');
      }).join('\n');
    } else {
      csv = $$('#pgrid .pcard, #pgrid > *', v).map(c => csvCell(c.textContent)).join('\n');
    }
  }
  if(!csv.trim()){ toast('This screen has nothing tabular to export'); return; }
  downloadFile(`dispo-${name}-${todayStr()}.csv`, csv);
}
function printView(){ window.print(); }
function cmdbarHtml(){
  return `<div class="cmdbar" role="toolbar" aria-label="Screen actions">
    <button class="btn sm" id="undoBtn" disabled>Undo</button>
    <span class="sp"></span>
    <button class="btn sm" id="expBtn">${IC.download} Export CSV</button>
    <button class="btn sm" id="printBtn">Print</button>
    <button class="btn sm" id="themeBtn2">${document.documentElement.getAttribute('data-theme')==='dark'?'Light':'Dark'}</button>
    ${(window.__dispoLockNow || document.getElementById('lock')) ? '<button class="btn sm" id="lockBtn2">Lock now</button>' : ''}
  </div>`;
}
function bindCmdbar(){
  const e = $('#expBtn'), p = $('#printBtn'), t = $('#themeBtn2'), l = $('#lockBtn2');
  if(e) e.onclick = exportCurrentView;
  if(p) p.onclick = printView;

}

/* ══════════ Dispo-Genius aware follow-up messages ══════════
   The note on each buyer row is the last conversation. Instead of one generic
   nudge, the message answers what was actually said: a date they gave, a
   closing they were waiting on, a financing question, or a soft no. */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function firstOf(name){ return String(name || '').trim().split(/\s+/)[0] || 'there'; }
function noteKind(note){
  const t = String(note || '').toLowerCase();
  if(!t.trim()) return {kind:'cold'};
  const dm = t.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  const words = t.match(/(next week|next month|next year|tomorrow|after the holiday|after christmas|after new year|after easter|in a (?:few|couple) (?:weeks|months))/);
  if(/not interested|remove me|don'?t contact|stop (calling|texting)|no longer|already bought|found (a|another) (house|property)/.test(t))
    return {kind:'no'};
  if(/clos(e|ing)|under contract|pending on|waiting on (the )?(loan|closing)/.test(t))
    return {kind:'closing'};
  if(/cash|hard money|private money|lender|loan|financ|mortgage|proof of funds|\bpof\b|dscr/.test(t))
    return {kind:'financing'};
  if(dm || words) return {kind:'date', when: dm ? `${dm[1]}/${dm[2]}` : words[1]};
  if(/said okay|sounds good|will (work on it|do|run)|send (me|it)|interested|let'?s|make an offer|offer|review|talk to my (client|partner|wife|husband)/.test(t))
    return {kind:'warm'};
  if(/no answer|left (a )?(voicemail|message)|didn'?t (answer|reply|respond)|no response|busy|call back|call later/.test(t))
    return {kind:'missed'};
  return {kind:'cold'};
}
function composeMessages(f){
  const n = firstOf(f.name), k = noteKind(f.note);
  const one = f.props[0] || 'the property';
  const all = f.props.length > 1
    ? f.props.slice(0, -1).join(', ') + ' and ' + f.props[f.props.length - 1]
    : one;
  const A = f.props.length > 1 ? `the ${f.props.length} properties you asked about (${all})` : one;
  const q = {
    warm: [
      `Hi ${n}, ${A} is still available. You mentioned you'd run it by your client — any word on it? I can send photos or the numbers again if that helps.`,
      `Hi ${n}, checking in on ${A}. Last time we spoke you were going to look it over — is it still on your list, or should I focus on something else?`,
      `Hey ${n}, ${A} is still on the market. Want me to hold it for your client while they decide?`,
    ],
    date: [
      `Hi ${n}, checking back as promised about ${A}. You said ${k.when} works better — does that still hold?`,
      `Hi ${n}, ${A} is still available. You asked me to reach out around ${k.when}, so here I am — are you still in a position to move?`,
      `Hey ${n}, following up on ${A} like you asked after ${k.when}. Anything change on your end?`,
    ],
    closing: [
      `Hi ${n}, hope the closing went well. Now that it's behind you, ${A} is still available — want to take a look?`,
      `Hi ${n}, checking in after the closing you mentioned. ${A} is still on the market — is now a better time?`,
      `Hey ${n}, congrats on wrapping things up. ${A} is still available if you want to keep it on the shortlist.`,
    ],
    financing: [
      `Hi ${n}, ${A} is still available. Are you buying cash or with a lender on this one? I can line up the right options before we talk numbers.`,
      `Hi ${n}, quick one on ${A} — do you have financing lined up, or should I connect you with someone who moves fast?`,
      `Hey ${n}, ${A} is still on the market. If you want, I can send over what a lender will need so you're ready.`,
    ],
    missed: [
      `Hi ${n}, tried you earlier about ${A}. Is now a better time for a quick call?`,
      `Hi ${n}, sorry I missed you — ${A} is still available. Want me to send the details here instead?`,
      `Hey ${n}, following up on ${A}. If a call is easier, tell me a time and I'll ring you then.`,
    ],
    no: [
      `Hi ${n}, I don't want to keep bothering you about ${A}. Want me to close your file, or keep you posted if something changes?`,
      `Hi ${n}, understood on ${A}. Should I take you off this one and only reach out when something new fits?`,
      `Hey ${n}, noted — no pressure on ${A}. Just say the word if you want back on the list.`,
    ],
    cold: [
      `Hi ${n}, ${A} is still available — is it still on your list?`,
      `Hi ${n}, checking in on ${A}. Still interested, or should I move on?`,
      `Hey ${n}, ${A} is still on the market. Want the current details?`,
    ],
  }[k.kind] || [];
  return q.map(m => m.replace(/\s+/g, ' ').trim());
}
const VAR_KEY = 'dispo:variant';
let VARIANT = store.get(VAR_KEY, {}) || {};
function enrichFollowups(){
  D.followups.forEach(f => {
    f._variants = composeMessages(f);
    f._kind = noteKind(f.note).kind;
    const i = Math.min(Number(VARIANT[f.raw] || 0), f._variants.length - 1);
    f._vi = i;
    f.msg = f._variants[i] || f.msg;
  });
}
function varyMessage(raw){
  VARIANT[raw] = (Number(VARIANT[raw] || 0) + 1) % 3;
  store.set(VAR_KEY, VARIANT);
  enrichFollowups(); route();
}

/* ── Mark sent also stamps the sheet, so Dispo Genius sees the same history ── */
function stampBuyersFor(raw){
  if(!raw) return 0;
  const day = todayStr();
  let n = 0;
  D.props.forEach(p => p.buyers.forEach(b => {
    if(digits(b.phone) !== raw) return;
    const bk = b._k || (p.row + '|' + p.buyers.indexOf(b) + '|' + (b.id || ''));
    EDITS.ov[bk] = EDITS.ov[bk] || {};
    EDITS.ov[bk].last = day;
    b._edited = true; b.last = day;
    touch(bk);
    n++;
  }));
  if(n) saveEdits();
  return n;
}

D0 = JSON.parse(JSON.stringify(D.props));
/* the site wins over the sheet: last stored snapshot, else the one baked in */
if(SITE_STORE && SITE_STORE.snap) applyLive(SITE_STORE.snap, true);
applySheetEdits();
renderNav();
route();
setTimeout(refreshSiteIfStale, 2500);
</script>
